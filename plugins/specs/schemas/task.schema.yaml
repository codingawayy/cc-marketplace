$schema: "https://json-schema.org/draft/2020-12/schema"
title: Task
description: Scheduled or async background task specification
type: object
required:
  - type
  - name
  - description
  - schedule
  - retryPolicy
properties:
  type:
    const: task
    description: Spec type for Hugo template selection
  name:
    type: string
    description: Task name
  description:
    type: string
    description: Detailed description of the task and its purpose
  schedule:
    type: string
    description: "Cron expression or interval (e.g., '0 0 * * *' for daily at midnight, 'every 5m')"
  retryPolicy:
    type: string
    description: How failures are handled
    enum:
      - none
      - exponential-backoff
      - indefinite
